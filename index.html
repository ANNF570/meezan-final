<!DOCTYPE html>
<html lang="en" data-theme="glass">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meezan — Sign in</title>
<meta name="description" content="Meezan — Islamic personal finance: budgeting, Zakat, Sadaqah, Eid savings and family expenses. Built by Akif Nehal.">
<meta name="author" content="Akif Nehal">
<meta name="theme-color" content="#0b0f18">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meezan">
<link rel="stylesheet" href="css/meezan.css">
<style>
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .login { width: min(100%, 420px); }
  .login-logo { text-align: center; margin-bottom: 14px; }
  .login-logo img { width: 72px; height: 72px; object-fit: contain; }
  .login-logo h1 { margin: 4px 0 0; font-family: var(--font-display); letter-spacing: 6px; font-size: 1.6rem; color: var(--gold-lt); }
  .login-logo p { margin: 2px 0 0; color: var(--text-dim); }
  .login .tabbar { margin-bottom: 14px; }
  .login form { display: grid; gap: 12px; }
  .login .btn { width: 100%; justify-content: center; }
  .or { text-align: center; color: var(--text-dim); font-size: 0.8rem; margin: 10px 0; }
  .login-credit { text-align: center; margin-top: 14px; font-size: 0.85rem; color: var(--text-dim); }
  .login-credit a { color: var(--gold-lt); }
  .link-row { text-align: end; }
</style>
<script src="js/i18n.js"></script>
<script src="js/i18n-v2.js"></script>
</head>
<body>
<main class="login card">
  <div class="login-logo">
    <img src="assets/logo-icon.png" alt="" width="72" height="72">
    <h1>MEEZAN</h1>
    <p>ميزان · The Scale of Balance</p>
  </div>

  <div class="tabbar" role="tablist">
    <button type="button" class="tab on" role="tab" data-mode="login">Sign in</button>
    <button type="button" class="tab" role="tab" data-mode="register">Register</button>
  </div>

  <button type="button" class="btn btn-ghost" id="google-btn">Continue with Google</button>
  <div class="or">or use your email</div>

  <form id="auth-form" novalidate>
    <div class="field" id="name-field" hidden><label for="a-name">Your name</label><input type="text" id="a-name" autocomplete="name" maxlength="60"></div>
    <div class="field"><label for="a-email">Email</label><input type="email" id="a-email" autocomplete="email" inputmode="email"></div>
    <div class="field"><label for="a-pass">Password</label><span class="pw-wrap"><input type="password" id="a-pass" autocomplete="current-password" minlength="6"><button type="button" class="pw-eye" id="pw-eye" aria-label="Show password" aria-pressed="false">👁️</button></span></div>
    <div class="link-row" id="forgot-row"><button type="button" class="link-btn" id="forgot-btn">Forgot password?</button></div>
    <button type="submit" class="btn btn-teal" id="submit-btn">Sign in</button>
  </form>

  <div class="banner banner-bad" id="auth-msg" hidden role="alert"></div>
  <div class="login-credit">Designed &amp; built by <a href="https://www.linkedin.com/in/akif-nehal/" target="_blank" rel="noopener noreferrer">Akif Nehal</a></div>
</main>
<noscript><p style="padding:20px">Meezan needs JavaScript to run.</p></noscript>
<script type="module" src="js/login.js"></script>
</body>
</html>
